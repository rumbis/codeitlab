<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080a" />
    <title>CodeItLab is offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #05080a;
        color: #e8fff5;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100%, 30rem);
        border: 1px solid rgb(61 255 158 / 22%);
        border-radius: 16px;
        padding: 28px;
        background: #0a1113;
        box-shadow: 0 24px 64px rgb(0 0 0 / 45%);
      }
      .eyebrow {
        margin: 0;
        color: #3dff9e;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
      }
      h1 {
        margin: 10px 0 0;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        margin: 12px 0 0;
        color: #9db5ad;
        font-size: 15px;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        border: 1px solid #3dff9e;
        border-radius: 10px;
        padding: 10px 18px;
        background: #3dff9e;
        color: #05080a;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #e8fff5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">CODEITLAB // OFFLINE</p>
      <h1>You are offline</h1>
      <p>
        CodeItLab needs a connection to reach your environments. Check your network, then reload.
      </p>
      <a href="/">Reload CodeItLab</a>
    </main>
  </body>
</html>
